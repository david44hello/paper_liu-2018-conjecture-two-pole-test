# Two-pole estimates for the Bergman projection.
name = "LiuLean"
version = "0.1.0"
defaultTargets = ["Liu"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Liu"
globs = ["Liu", "Liu.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "Challenge"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
