  - Quot.sound
  - Classical.choice
automation:
  methods:
  - method: agent
    tool_setup: AI agents wrote Lean and carried out machine checks under the author's direction.
fidelity:
  divergences: Theorems 1.1 and 3.5 are proved in Lean conditional on Certificate.boxBounds, which
    encodes the Proposition 6.1 inequalities over the 168 fixed boxes established by computer outside
    Lean. The full Liu (2018) conjecture is not claimed proved; this entry covers only the two-pole
    test of the paper.
review:
