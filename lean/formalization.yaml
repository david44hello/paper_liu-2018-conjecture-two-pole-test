version: v0.4
project:
  name: A two-pole test of the Liu (2018) conjecture on the norm of the Bergman projection
  description: For every two-pole Pick function in the upper half-plane (including coincident poles),
    assuming the computer-checked bounds of Proposition 6.1 over 168 fixed boxes as one explicit
    hypothesis, Lean proves the strict finite-part deficit inequality (Theorem 3.5) and hence negative
    slope and strict Bergman-quotient inequality below pi^2/12 for sufficiently small positive exponent
    increments (Theorem 1.1). Proposition 6.1 is checked by computer outside Lean. The full Liu (2018)
    conjecture remains open.
  authors:
  - Dave Goel
  license: Apache-2.0
  responsible_maintainers:
  - Dave Goel
classification:
  arxiv:
