  - 47B38
  - 65G30
sources:
- title: A two-pole test of the Liu (2018) conjecture on the norm of the Bergman projection
  authors:
  - Dave Goel
  id: 10.5281/zenodo.24573671
  type: paper
  location: https://doi.org/10.5281/zenodo.24573671
  relationship: formalizes
status:
  scope: The two compared statements formalize Theorems 1.1 and 3.5 for arbitrary two-pole Pick
    functions, including coincident poles. Both theorems take Certificate.boxBounds (the Proposition 6.1
    bounds over the exact 168 fixed boxes) as one explicit hypothesis. Proposition 6.1 is checked by
    computer outside Lean using interval-arithmetic programs and 168 box logs included in the repository.
    The scalar interpolation premise (a cited scalar interpolation bound, Ibrahimoglu 2016) enters Lemma 6.5 separately and is not used by Theorems 1.1 or
    3.5. The full Liu (2018) conjecture itself remains open.
  sorry_count: 0
  sorry_in_definitions: 0
